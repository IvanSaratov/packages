name: Publish DNF repository

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Build Fedora repository tools
        run: docker build -t rpm-repository-tools tools

      - name: Test signature policy and repository generation
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$PWD,target=/source,readonly" \
            rpm-repository-tools python3 -m unittest discover -s tests -v

      - name: Generate verified public site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm --env GH_TOKEN \
            --mount "type=bind,source=$PWD,target=/source,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP,target=/artifacts" \
            rpm-repository-tools python3 scripts/build_repository.py \
            --config /source/repository.json --output /artifacts/site

      - name: Query and download through DNF
        run: |
          docker run --rm \
            --mount "type=bind,source=$PWD,target=/source,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/site,target=/artifacts/site,readonly" \
            rpm-repository-tools python3 tests/check_dnf.py --site /artifacts/site

      - name: Upload only the generated site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
